# API Gateway edge service: exposes the order APIs and forwards traffic to the order service.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: false
            max-age: 3600
      httpserver:
        wiretap: false
