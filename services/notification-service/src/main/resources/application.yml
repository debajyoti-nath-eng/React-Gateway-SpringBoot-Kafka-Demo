# Notification consumer: listens for order-created events and logs them.
spring:
  application:
    name: notification-service
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:order-notifications}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.orders.event.OrderCreatedEvent
        spring.json.trusted.packages: com.example.orders.event
        spring.json.use.type.headers: false

app:
  kafka:
    topic: ${KAFKA_TOPIC:orders.created}
